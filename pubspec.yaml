name: rideapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0
dependencies:
  cupertino_icons: ^1.0.2
  file_picker: ^8.3.6
  firebase_messaging: ^15.2.4
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_polyline_points: ^2.1.0
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  get: 4.6.6
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  google_maps_flutter: any
  google_sign_in: ^6.2.1
  http: ^1.3.0
  image_picker: ^1.1.2
  intl_phone_number_input: ^0.7.3
  location: ^7.0.1
  pin_code_fields: ^8.0.0
  pusher_channels_flutter: ^2.4.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  widget_to_marker: ^1.0.6

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Regular.ttf
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Poppins-Italic.ttf
          style: italic
  assets:
    - assets/google_fonts/
    - assets/
    - assets/icons/
    - assets/rider/
    - assets/cars/
  uses-material-design: true
